services:
  - type: web
    name: knoxit-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run typecheck:server
    startCommand: npm run db:migrate && npm run start:api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TTL_DAYS
        value: 30
      - key: BETA_STARTING_CHIPS
        value: 1000
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FOOTBALL_DATA_SYNC_SECRET
        generateValue: true
      - key: FOOTBALL_SYNC_MAX_AGE_MINUTES
        value: 30
      - key: RESULTS_ENGINE_ENABLED
        value: true
      - key: OPERATIONS_ENABLED
        value: true
